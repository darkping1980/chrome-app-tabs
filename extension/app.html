<html lang="ko">
<head>
<meta charset="utf-8">
<title>App Tab</title>
<link rel="icon" id="fav">
<link rel="stylesheet" href="ui.css">
<style>
  body { margin: 0; display: grid; place-items: center; height: 100vh; cursor: default; }
  .box { max-width: 560px; padding: 24px; text-align: center; }
  .box > img { width: 48px; height: 48px; }
  .muted { color: var(--muted); font-size: 12px; word-break: break-all; }
  #peek { display: none; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; }
  body.peeking #peek { display: block; }
  ul { list-style: none; padding: 0; text-align: left; }
  li { padding: 6px; cursor: pointer; border-radius: 6px; } li:hover { background: var(--hover); }
</style>
</head>
<body>
  <div class="box">
    <img id="icon" alt="">
    <h2 id="name"></h2>
    <p id="status">이 탭이 활성화되면 연결된 프로그램 창이 이 영역에 표시됩니다.</p>
    <div id="peek">주소창을 쓰는 동안 프로그램을 잠시 숨겼습니다.<br><b>Esc</b>를 누르거나 이 영역을 클릭하면 다시 표시됩니다.</div>
    <p class="muted" id="info"></p>
    <p><input type="text" id="rename" placeholder="탭 이름"> <button id="save">이름 변경</button> <button id="off">연결 해제</button></p>
    <div id="relink" hidden>
      <p><b>연결된 창이 종료되었습니다.</b> 다시 실행한 창을 선택하세요.</p>
      <button id="scan">창 다시 찾기</button>
      <ul id="cands"></ul>
    </div>
    <p class="muted">연결 해제나 탭 닫기는 연결만 끊습니다. 프로그램은 종료되지 않고 원래 위치로 돌아갑니다.<br>
      단축키: <span id="keys"></span></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
